version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stagepass_api_prod
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/stagepass
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    restart: always
    networks:
      - stagepass_network

  mongo:
    image: mongo:7
    container_name: stagepass_db_prod
    ports:
      - "27017:27017" # Optional in prod if we only access internally
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - stagepass_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stagepass_web_prod
    depends_on:
      - backend
    restart: always
    networks:
      - stagepass_network

  nginx:
    image: nginx:alpine
    container_name: stagepass_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - stagepass_network

networks:
  stagepass_network:
    driver: bridge

volumes:
  mongo_data:
